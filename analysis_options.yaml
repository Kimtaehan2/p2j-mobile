include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - web/**
  errors:
    # freezed 팩토리 파라미터에 @JsonKey 를 붙일 때 나오는 오탐. 공식 권장 설정이다.
    invalid_annotation_target: ignore
    # custom_lint 가 아직 새 플러그인 체계로 넘어오지 않았다. 넘어오면 지운다.
    analysis_options_deprecated_plugins: ignore

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
